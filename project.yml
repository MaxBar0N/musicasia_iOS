name: MusicAsia
options:
  deploymentTarget:
    iOS: 15.0

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: 5.9.0
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: 5.7.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 7.11.0

targets:
  MusicAsia:
    type: application
    platform: iOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cn.musicasia.singword
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "" # Xcode会自动管理，或者你可以填入你的Team ID
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
    sources: 
      - path: MusicAsia/Sources
      - path: MusicAsia/Resources
    dependencies:
      - package: Alamofire
      - package: SnapKit
      - package: Kingfisher
    info:
      path: MusicAsia/Info.plist
      properties:
        CFBundleDisplayName: "唱享视界"
        CFBundleName: "唱享视界"
        CFBundleDevelopmentRegion: "zh_CN"
        CFBundleLocalizations:
          - "zh_CN"
        UILaunchScreen:
          UIImageName: "login_logo_icon"
          UIColorName: "LaunchBackgroundColor"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSCameraUsageDescription: "扫描二维码需要使用您的相机"
        NSPhotoLibraryAddUsageDescription: "我们需要您的同意才能将二维码保存到相册"
        NSBluetoothAlwaysUsageDescription: "连接音乐外设需要使用您的蓝牙"
        NSBluetoothPeripheralUsageDescription: "连接音乐外设需要使用您的蓝牙"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        LSApplicationQueriesSchemes:
          - weixin
          - weixinULAPI
          - alipay
          - alipayshare
          - kuanshijie
          - wotvapp
